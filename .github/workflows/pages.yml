# ينشر نسخة ثابتة من التطبيق على GitHub Pages عند كل دفع للفرع الافتراضي.
# النسخة الثابتة تعمل بملف التجربة، والقصص وتوليد المحتوى تحتاج خادمًا (Vercel).
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/blissful-planck-1n5m3c]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC: '1'
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
